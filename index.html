<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        .lyrics-display {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            10% {
                opacity: 1;
                transform: scale(1);
            }
            90% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .lyrics-display.active {
            animation: pulse 0.6s ease-in-out;
        }

        .song-info {
            color: rgba(255, 255, 255, 0.8);
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lyrics-display" id="lyricsDisplay"></div>
        <div class="song-info">🎵 Music is playing...</div>
    </div>

    <script>
        // Song lyrics with timing (in seconds)
        const lyrics = [
            { time: 0, text: "🎵 Welcome to the Song 🎵" },
            { time: 2, text: "Let the music play" },
            { time: 4, text: "Feel the rhythm all day" },
            { time: 6, text: "Dancing through the night" },
            { time: 8, text: "Everything feels right" },
            { time: 10, text: "Singing loud and clear" },
            { time: 12, text: "Music in my ear" },
            { time: 14, text: "This is our moment" },
            { time: 16, text: "Time to own it" },
            { time: 18, text: "Moving to the beat" },
            { time: 20, text: "Can't feel my feet" },
            { time: 22, text: "One, two, three, four" },
            { time: 24, text: "Give me more and more" },
            { time: 26, text: "Hands up in the sky" },
            { time: 28, text: "Let the music fly" },
            { time: 30, text: "🎵 Thanks for listening! 🎵" }
        ];

        const lyricsDisplay = document.getElementById('lyricsDisplay');
        let currentLyricIndex = -1;

        // Auto-play lyrics
        function playLyrics() {
            lyrics.forEach((lyric, index) => {
                setTimeout(() => {
                    lyricsDisplay.textContent = lyric.text;
                    lyricsDisplay.classList.remove('active');
                    // Trigger animation
                    void lyricsDisplay.offsetWidth;
                    lyricsDisplay.classList.add('active');
                }, lyric.time * 1000);
            });
        }

        // Start when page loads
        window.addEventListener('load', () => {
            playLyrics();
        });
    </script>
</body>
</html>
